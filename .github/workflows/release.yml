name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.release.assets[0] == null
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Ensure tag is on main
        working-directory: .
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag $(git rev-parse --short HEAD) is not on origin/main"
            exit 1
          fi

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm squashfs-tools xvfb
        working-directory: .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild macOS DMG natives
        if: runner.os == 'macOS'
        run: pnpm rebuild macos-alias fs-xattr

      - name: Build installers
        run: pnpm run make

      - name: Configure Linux sandbox for unpacked CLI tests
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root out/electron-svelte-linux-x64/chrome-sandbox
          sudo chmod 4755 out/electron-svelte-linux-x64/chrome-sandbox

      - name: Verify command installation
        run: node --experimental-strip-types scripts/verify-cli-install.mjs

      - name: Verify packaged CLI
        shell: bash
        run: node scripts/verify-cli.mjs

      - name: Verify installed Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out/make/squirrel.windows/x64/*Setup.exe).FullName
          $installer = Start-Process -FilePath $setup -ArgumentList '--silent' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          auto-rob --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed macOS CLI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo installer -pkg out/make/*.pkg -target /
          /usr/local/bin/auto-rob --version

      - name: Verify installed Linux CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -i out/make/deb/x64/*.deb
          test -x /usr/bin/auto-rob
          auto-rob --version

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p ../release-assets
          find out/make -type f \( \
            -name '*Setup.exe' -o \
            -name '*.dmg' -o \
            -name '*.pkg' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.AppImage' -o \
            -name '*.zip' \
          \) -exec cp {} ../release-assets/ \;
          echo "Collected assets:"
          ls -la ../release-assets

      - name: Upload installers to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
